<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Skimvo</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <img src="../icons/icon48.png" alt="" />
        <h1>Skimvo</h1>
      </div>
      <label class="switch" title="暂停 / 恢复接管">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </header>

    <div class="rate-row">
      <input type="text" id="rateBox" inputmode="decimal" value="1" title="点击输入任意倍数，回车生效（0.07–16）" />
      <span class="x">×</span>
    </div>

    <input type="range" id="rate" min="0.25" max="16" step="0.05" value="1" />

    <div class="scale">
      <span>0.25×</span><span>1×</span><span>16×</span>
    </div>

    <div class="presets">
      <button data-rate="0.5">0.5×</button>
      <button data-rate="1">1×</button>
      <button data-rate="1.25">1.25×</button>
      <button data-rate="1.5">1.5×</button>
      <button data-rate="2">2×</button>
      <button data-rate="4">4×</button>
      <button data-rate="6">6×</button>
      <button data-rate="8">8×</button>
    </div>

    <div class="ver" id="ver"></div>
    <div class="ver">Developer: yongzhong</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
